name: Build and Publish Docker Image

on:

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/vinicius05051993/knowledge-hub:latest
            ghcr.io/vinicius05051993/knowledge-hub:${{ github.sha }}