name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - 'go.mod'
      - '.github/workflows/**'
      - '.dockerignore'

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/vinicius05051993/knowledge-hub-api:latest
            ghcr.io/vinicius05051993/knowledge-hub-api:${{ github.sha }}

      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/vinicius05051993/knowledge-hub-worker:latest
            ghcr.io/vinicius05051993/knowledge-hub-worker:${{ github.sha }}