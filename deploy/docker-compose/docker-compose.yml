services:

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    image: ghcr.io/vinicius05051993/knowledge-hub:latest

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - mysql
      - opensearch

    expose:
      - "8080"

  sync-worker:
    image: ghcr.io/vinicius05051993/knowledge-hub:latest

    command: ./sync-worker

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - mysql
      - opensearch

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  opensearch:
    image: opensearchproject/opensearch:3

    restart: unless-stopped

    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
      - "9200:9200"
      - "9600:9600"

    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:

  mysql_data:

  opensearch_data: