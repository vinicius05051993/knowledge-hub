services:

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  api:
    image: ghcr.io/vinicius05051993/knowledge-hub:latest

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

      opensearch:
        condition: service_healthy

    expose:
      - "8080"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  sync-worker:
    image: ghcr.io/vinicius05051993/knowledge-hub:latest

    command: ./sync-worker

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

      opensearch:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  opensearch:
    image: opensearchproject/opensearch:3

    restart: unless-stopped

    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"

    volumes:
      - opensearch_data:/usr/share/opensearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200 >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:

  mysql_data:

  opensearch_data: